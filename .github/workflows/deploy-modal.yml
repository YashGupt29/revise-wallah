name: Deploy Modal Pipeline

on:
  push:
    branches: [main]
    paths:
      - "modal_pipeline/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install modal pydantic google-generativeai supabase yt-dlp

      - name: Deploy to Modal
        uses: modal-labs/deploy-modal-app@v1
        with:
          app-file: modal_pipeline/main.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
