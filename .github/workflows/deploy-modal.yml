name: Deploy Modal Pipeline

on:
  push:
    branches: [main]
    paths:
      - "modal_pipeline/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install modal pydantic google-genai supabase yt-dlp "fastapi[standard]" youtube-transcript-api faster-whisper

      - name: Write Modal token config
        run: |
          mkdir -p ~/.modal
          cat > ~/.modal.toml <<EOF
          [default]
          token_id = "${{ secrets.MODAL_TOKEN_ID }}"
          token_secret = "${{ secrets.MODAL_TOKEN_SECRET }}"
          EOF

      - name: Deploy pipeline
        run: modal deploy modal_pipeline/main.py
